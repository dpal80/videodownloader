# Avvio: docker compose up -d --build   →   http://127.0.0.1:8000
services:
  grabby:
    build: .
    image: grabby-video-downloader
    container_name: grabby
    # Solo su 127.0.0.1: la pagina non è raggiungibile da altri dispositivi.
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      # Mostrata nella pagina al posto di /downloads.
      DOWNLOAD_DIR_LABEL: "${DOWNLOAD_DIR:-~/Downloads}"
    volumes:
      - "${DOWNLOAD_DIR:-~/Downloads}:/downloads"
    restart: unless-stopped
