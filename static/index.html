<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grabby Video Downloader</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --text: #1d1f23; --muted: #6b7280;
      --border: #dfe2e7; --accent: #2563eb; --accent-text: #ffffff;
      --error: #b91c1c; --ok: #15803d; --bar-bg: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317; --card: #1b1e24; --text: #e8eaee; --muted: #9aa1ad;
        --border: #2d323b; --accent: #3b82f6; --error: #f87171; --ok: #4ade80; --bar-bg: #2d323b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 640px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
    input, select, button { font: inherit; }
    input, select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text);
    }
    .row { display: flex; gap: 12px; margin-top: 16px; }
    .row > div { flex: 1; }
    .url-row { display: flex; gap: 8px; }
    .url-row input { flex: 1; }
    button {
      padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--accent); color: var(--accent-text); font-weight: 600; white-space: nowrap;
    }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
    button:disabled { opacity: .5; cursor: default; }
    .primary { width: 100%; margin-top: 20px; padding: 12px; }
    .preview { display: none; gap: 12px; margin-top: 16px; align-items: center; }
    .preview img { width: 120px; border-radius: 8px; }
    .preview .title { font-weight: 600; }
    .preview .meta { color: var(--muted); font-size: .9rem; }
    .msg { margin-top: 12px; font-size: .95rem; }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--ok); }
    .bar { height: 10px; background: var(--bar-bg); border-radius: 5px; overflow: hidden; margin-top: 12px; }
    .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    #progress-card { display: none; }
    .muted { color: var(--muted); font-size: .9rem; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    @media (max-width: 480px) { .row, .url-row { flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <h1 class="brand"><img src="/static/logo.svg" alt="" width="40" height="40"> Grabby Video Downloader</h1>
  <p class="sub">Incolla un link di YouTube o Facebook, scegli formato e risoluzione e scarica.</p>

  <div class="card">
    <label for="url">Link del video</label>
    <div class="url-row">
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
      <button id="check" class="secondary">Analizza</button>
    </div>

    <div class="preview" id="preview">
      <img id="thumb" alt="">
      <div>
        <div class="title" id="title"></div>
        <div class="meta" id="meta"></div>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="format">Formato</label>
        <select id="format"></select>
      </div>
      <div>
        <label for="resolution">Risoluzione</label>
        <select id="resolution"></select>
      </div>
    </div>

    <button id="download" class="primary">Scarica</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="progress-card">
    <div id="status">In coda…</div>
    <div class="bar"><div id="bar"></div></div>
    <div class="muted" id="details"></div>
    <div class="actions"><button id="open" class="secondary" style="display:none">Apri cartella</button></div>
  </div>

  <p class="muted" id="dir"></p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let formats = [];
  let allResolutions = [];
  let availableHeights = null;

  const resLabel = (r) => ({ best: "Migliore disponibile", 2160: "2160p (4K)", 1440: "1440p (2K)" }[r] || r + "p");

  function fillResolutions() {
    const fmt = formats.find((f) => f.value === $("format").value);
    const sel = $("resolution");
    const current = sel.value;
    sel.innerHTML = "";
    sel.disabled = fmt && fmt.audio_only;
    if (sel.disabled) {
      sel.add(new Option("Non necessaria (solo audio)", "best"));
      return;
    }
    allResolutions
      .filter((r) => r === "best" || !availableHeights || Number(r) <= Math.max(...availableHeights))
      .forEach((r) => sel.add(new Option(resLabel(r), r)));
    if ([...sel.options].some((o) => o.value === current)) sel.value = current;
  }

  function showMsg(text, kind = "") {
    $("msg").textContent = text;
    $("msg").className = "msg " + kind;
  }

  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Errore sconosciuto");
    return data;
  }

  function fmtDuration(s) {
    if (!s) return "";
    s = Math.round(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
  }

  function fmtBytes(b) {
    if (!b) return "";
    const u = ["B/s", "KB/s", "MB/s", "GB/s"];
    let i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(1) + " " + u[i];
  }

  async function init() {
    const opts = await api("/api/options");
    formats = opts.formats;
    allResolutions = opts.resolutions;
    formats.forEach((f) => $("format").add(new Option(f.label, f.value)));
    fillResolutions();
    $("dir").textContent = "I file vengono salvati in: " + opts.download_dir;
  }

  $("format").addEventListener("change", fillResolutions);
  $("url").addEventListener("input", () => { availableHeights = null; $("preview").style.display = "none"; fillResolutions(); });
  $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") $("check").click(); });

  $("check").addEventListener("click", async () => {
    const url = $("url").value.trim();
    if (!url) return showMsg("Incolla prima un link.", "error");
    $("check").disabled = true;
    showMsg("Analizzo il video…");
    try {
      const info = await api("/api/info", { url });
      $("thumb").src = info.thumbnail || "";
      $("title").textContent = info.title || "";
      $("meta").textContent = [info.uploader, fmtDuration(info.duration)].filter(Boolean).join(" · ");
      $("preview").style.display = "flex";
      availableHeights = info.heights && info.heights.length ? info.heights : null;
      fillResolutions();
      showMsg("");
    } catch (e) {
      showMsg(e.message, "error");
    } finally {
      $("check").disabled = false;
    }
  });

  $("download").addEventListener("click", async () => {
    const url = $("url").value.trim();
    if (!url) return showMsg("Incolla prima un link.", "error");
    $("download").disabled = true;
    showMsg("");
    try {
      const job = await api("/api/download", { url, format: $("format").value, resolution: $("resolution").value });
      $("progress-card").style.display = "block";
      $("open").style.display = "none";
      poll(job.id);
    } catch (e) {
      showMsg(e.message, "error");
      $("download").disabled = false;
    }
  });

  $("open").addEventListener("click", () => api("/api/open-folder", {}));

  const statusText = { "in coda": "In coda…", download: "Download in corso…", conversione: "Conversione in corso…" };

  async function poll(id) {
    try {
      const j = await api("/api/progress/" + id);
      $("bar").style.width = j.percent + "%";
      if (j.status === "completato") {
        $("status").textContent = "✅ Download completato!";
        $("details").textContent = j.filename || "";
        $("open").style.display = "inline-block";
        $("download").disabled = false;
        return;
      }
      if (j.status === "errore") {
        $("status").textContent = "❌ Errore durante il download";
        $("details").textContent = j.error || "";
        $("download").disabled = false;
        return;
      }
      $("status").textContent = (statusText[j.status] || j.status) + " " + (j.status === "download" ? j.percent + "%" : "");
      $("details").textContent = [fmtBytes(j.speed), j.eta ? "mancano " + fmtDuration(j.eta) : ""].filter(Boolean).join(" · ");
      setTimeout(() => poll(id), 700);
    } catch (e) {
      $("status").textContent = "❌ " + e.message;
      $("download").disabled = false;
    }
  }

  init().catch((e) => showMsg("Impossibile contattare il server: " + e.message, "error"));
</script>
</body>
</html>
